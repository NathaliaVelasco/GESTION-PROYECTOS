<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raspa y gana · Innovation Day: Reto para distribuidores</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#011B12; --panel:rgba(10,46,34,.9); --ink:#FFFFFF; --muted:#BFFDE3;
  --brand:#05DD4D; --teal:#19A591; --mteal:#1CCF93; --line:rgba(5,221,77,.28);
  --font:"Figtree", "Helvetica Neue",Arial,sans-serif; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg) url("assets/kv-ondas.webp") center/cover fixed;color:var(--ink);font-family:var(--font)}
.wrap{min-height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px clamp(16px,5vw,48px);background:rgba(1,27,18,.72);max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:14px}
header img{height:28px;width:auto}
header span{border-left:1px solid var(--line);padding-left:14px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;line-height:1.3}
header em{display:block;font-style:normal;letter-spacing:.03em;text-transform:none;color:var(--brand);font-size:13px}
.eyebrow{margin:0;color:var(--brand);font-weight:700;font-size:14px;letter-spacing:.2em;text-transform:uppercase}
h1{margin:6px 0 0;font-size:clamp(38px,10vw,58px);line-height:1;font-weight:700}
h1 b{color:var(--brand)}
.lede{margin:0;color:var(--muted);font-size:19px;line-height:1.4}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;font-size:19px;line-height:1.4}
.card{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/3;max-height:420px;border:3px solid var(--brand);box-shadow:0 18px 50px rgba(0,0,0,.45);user-select:none;-webkit-user-select:none}
.prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:22px;
  background:radial-gradient(circle at 50% 35%,#ffffff 0%,#E8FFF3 55%,#BFFDE3 100%);color:#01332B}
.prize small{font-size:15px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--teal)}
.prize strong{font-size:clamp(28px,8vw,44px);line-height:1.1}
.prize span{font-size:17px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer;transition:opacity .6s ease}
canvas.gone{opacity:0;pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:18px;background:var(--brand);color:var(--bg);border:0;border-radius:999px;padding:14px 26px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.claim{border-left:6px solid var(--brand);padding-left:16px;font-size:19px;line-height:1.4}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.conf{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.conf{display:none}canvas{transition:none}.spin{animation:none}}
footer{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="assets/logo-blanco.png" alt="Solventum"><span>Innovation Day<em>El arte de construir grandes alianzas</em></span></header>
  <div>
    <p class="eyebrow">Reto para distribuidores · Top&nbsp;10</p>
    <h1>Raspa y <b>gana</b></h1>
  </div>
  <main id="view" aria-live="polite"><p class="panel"><span class="spin"></span>Buscando tu partida…</p></main>
  <footer><span>Desarrollado por: nathalia@experienciasimone.com</span><span><a href="./">Volver al juego</a> · <a href="ranking.html">Ver ranking</a></span></footer>
</div>
<script>
const API={url:"https://tovzbcwwdxueejgidoze.supabase.co/rest/v1/rpc/",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvdnpiY3d3ZHh1ZWVqZ2lkb3plIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MDA0NzAsImV4cCI6MjEwODI3NjQ3MH0.dHKHFpeYk00g93FEEF4BW5xzzHgXXQgg69ejzW0rWak"};
async function rpc(fn,body){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),6000);
  try{ const r=await fetch(API.url+fn,{method:"POST",signal:ctl.signal,headers:{"apikey":API.key,"Authorization":"Bearer "+API.key,"Content-Type":"application/json"},body:JSON.stringify(body||{})});
    if(!r.ok){ const e=new Error("http "+r.status); e.status=r.status; throw e; } return await r.json(); } finally{ clearTimeout(t); }
}
const TKEY="innovation-day-raspa-tokens";
const view=document.getElementById("view");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mine=()=>{ try{ return JSON.parse(localStorage.getItem(TKEY)||"[]"); }catch(_){ return []; } };
let timer=null, shown=false;

async function check(){
  const list=mine();
  if(!list.length){
    view.innerHTML=`<div class="panel"><p style="margin:0 0 14px">No encontramos partidas jugadas desde este celular.</p><p class="lede" style="margin:0 0 16px">El raspa y gana es para los 10 primeros del ranking y se abre en el mismo celular con el que jugaron.</p><a class="btn" href="./">Jugar el reto</a></div>`;
    return;
  }
  let res;
  try{ res = await Promise.all(list.map(x=>rpc("innov_mi_raspa",{p_token:x.k}).then(r=>({...r,k:x.k})))); }
  catch(_){ if(!shown) view.innerHTML=`<p class="panel">Sin conexión. Revisa tu internet; volvemos a intentar en unos segundos.</p>`; schedule(); return; }
  const win=res.filter(r=>r.estado==="ganador").sort((a,b)=>a.puesto-b.puesto)[0];
  if(win){ clearTimeout(timer); if(!shown) showCard(win); return; }
  if(res.some(r=>r.estado==="inactivo")){
    const n=res.find(r=>r.estado==="inactivo").nombre;
    view.innerHTML=`<div class="panel"><p style="margin:0 0 10px;font-weight:700">Hola, ${esc(n)}.</p><p style="margin:0 0 10px">El raspa y gana se abre al cierre del reto, cuando se congela el top 10.</p><p class="lede" style="margin:0"><span class="spin"></span>Deja esta página abierta: tu tarjeta aparecerá aquí sola si quedaste entre los 10 primeros.</p></div>`;
    schedule(); return;
  }
  if(res.some(r=>r.estado==="no_ganador")){
    const n=res.find(r=>r.estado==="no_ganador").nombre;
    view.innerHTML=`<div class="panel"><p style="margin:0 0 10px;font-weight:700">¡Gracias por jugar, ${esc(n)}!</p><p style="margin:0 0 10px">Esta vez no quedaste entre los 10 primeros, pero ya sabes cómo explicar la solución integral de Solventum en los 4 momentos de Jesús.</p><a class="btn ghost" href="assets/informe-caso-jesus.pdf" download="Informe-caso-Jesus-Innovation-Day.pdf">⬇ Descarga ingreso INNOVATION DAY</a></div>`;
    return;
  }
  view.innerHTML=`<div class="panel"><p style="margin:0 0 14px">Tus partidas en este celular son de una ronda anterior del ranking.</p><a class="btn" href="./">Jugar el reto</a></div>`;
}
function schedule(){ clearTimeout(timer); timer=setTimeout(check,8000); }

function showCard(w){
  shown=true;
  view.innerHTML=`<div style="display:grid;gap:18px">
    <p class="lede" style="color:var(--ink);font-size:21px"><b>¡Felicitaciones, ${esc(w.nombre)}!</b> Quedaste en el puesto <b style="color:var(--brand)">${w.puesto}</b> del ranking.</p>
    <div class="card" id="card">
      <div class="prize"><small>Tu premio</small><strong>${esc(w.premio)}</strong><span>Puesto ${w.puesto} · Reto para distribuidores</span></div>
      <canvas id="sc" aria-label="Tarjeta para raspar. Pasa el dedo para descubrir tu premio." role="img"></canvas>
    </div>
    <div class="row" id="acts"><button class="btn ghost" id="reveal" type="button">Descubrir sin raspar</button></div>
    <p class="claim hidden" id="claim" hidden>Muestra esta pantalla en el stand de Solventum para reclamar tu premio.</p>
  </div>`;
  const cv=document.getElementById("sc"), card=document.getElementById("card");
  const done=()=>{ if(cv.classList.contains("gone")) return; cv.classList.add("gone"); document.getElementById("acts").remove(); const c=document.getElementById("claim"); c.hidden=false; confetti(); rpc("innov_raspar",{p_token:w.k}).catch(()=>{}); };
  document.getElementById("reveal").onclick=done;
  if(w.raspado){ done(); return; }
  const dpr=Math.min(window.devicePixelRatio||1,2), r=card.getBoundingClientRect();
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const W=r.width,H=r.height;
  const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,"#05DD4D"); g.addColorStop(.5,"#19A591"); g.addColorStop(1,"#01332B");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.12)";
  for(let y=10;y<H;y+=18) for(let x=(y/18%2)*9;x<W;x+=18){ ctx.beginPath(); ctx.arc(x,y,2,0,7); ctx.fill(); }
  ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.textBaseline="middle";
  const FF=getComputedStyle(document.body).fontFamily;
  ctx.font=`700 ${Math.round(W/10)}px ${FF}`; ctx.fillText("RASPA AQUÍ",W/2,H/2-W/24);
  ctx.font=`400 ${Math.round(W/24)}px ${FF}`; ctx.fillText("Pasa el dedo para descubrir tu premio",W/2,H/2+W/16);
  ctx.globalCompositeOperation="destination-out"; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=Math.max(36,W/9);
  let down=false,last=null,moves=0;
  const pos=e=>{ const b=cv.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}; };
  const cleared=()=>{ const d=ctx.getImageData(0,0,cv.width,cv.height).data; let t=0,c=0; for(let i=3;i<d.length;i+=4*40){ t++; if(d[i]===0) c++; } return c/t; };
  cv.addEventListener("pointerdown",e=>{ down=true; last=pos(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(last.x,last.y,ctx.lineWidth/2,0,7); ctx.fill(); });
  cv.addEventListener("pointermove",e=>{ if(!down) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; if(++moves%12===0 && cleared()>0.5) done(); });
  const up=()=>{ down=false; if(cleared()>0.5) done(); };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#05DD4D","#1CCF93","#19A591","#BFFDE3","#FFFFFF"];
  for(let i=0;i<70;i++){ const s=document.createElement("i"); s.className="conf"; s.style.left=Math.random()*100+"vw"; s.style.background=cols[i%cols.length];
    s.style.animationDuration=(2+Math.random()*2.5)+"s"; s.style.animationDelay=(Math.random()*.6)+"s"; document.body.appendChild(s); setTimeout(()=>s.remove(),5500); }
}
check();
</script>
</body>
</html>

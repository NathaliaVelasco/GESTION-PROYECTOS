<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovation Day: Reto para distribuidores</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Key visual Channel Annual Meeting: verde profundo, dorado y el mapa de Colombia de fondo */
  --bg:#011B12; --panel:#0A2E22; --ink:#FFFFFF; --muted:#BFFDE3;
  --brand:#05DD4D; --teal:#19A591; --gold:#05DD4D; --line:rgba(191,253,227,.2);
  --bad:#FF8A73;
  --font:"Figtree", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(90deg,rgba(1,27,18,.96) 0%,rgba(1,27,18,.9) 45%,rgba(1,27,18,.6) 100%),url("assets/kv-fondo.webp") right center/cover no-repeat var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
@media (orientation:portrait){body{background-image:linear-gradient(180deg,rgba(1,27,18,.8),rgba(1,27,18,.92)),url("assets/kv-ondas.webp")}}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.app{min-height:100%;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;padding:18px clamp(16px,4vw,40px)}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.lockup{display:flex;align-items:center;gap:16px}
.lockup img{height:30px;width:auto}
.lockup span{border-left:1px solid var(--line);padding-left:16px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;line-height:1.3}
.lockup em{display:block;font-style:normal;letter-spacing:.04em;text-transform:none;color:var(--gold);font-size:14px}
.hud{display:flex;gap:20px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:16px}
.hud b{color:var(--ink);font-size:20px}
main{flex:1;padding:22px 0}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:700}
h1{font-size:clamp(34px,5.4vw,62px);line-height:1.02}
h1 small{display:block;font-size:.5em;color:var(--gold);font-weight:400;margin-top:10px;line-height:1.2}
h2{font-size:clamp(24px,3.2vw,34px);line-height:1.15}
.lede{font-size:clamp(18px,2vw,21px);color:var(--muted);max-width:62ch;margin:0}
.eyebrow{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0}
.btn{border:0;border-radius:999px;background:var(--brand);color:var(--bg);font-weight:700;font-size:20px;padding:16px 32px;min-height:56px}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:var(--gold)}
a.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.dl{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:rgba(5,221,77,.12);border:2px solid var(--gold);border-radius:20px;padding:18px 22px}
.dl p{margin:0;font-size:16px;color:var(--muted)}
@media (max-width:640px){.dl{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hidden{display:none!important}

/* Portada */
.cover{position:fixed;inset:0;z-index:20;border:0;padding:0;margin:0;width:100%;background:#011B12 url("assets/kv-portada.webp") center/contain no-repeat;display:flex;align-items:flex-end;justify-content:center}
.cover.closed{cursor:default}
.cover.closed span{animation:none;max-width:min(92vw,820px);text-align:center;line-height:1.3}
.cover span{margin-bottom:5vh;background:var(--gold);color:var(--bg);font-weight:700;font-size:clamp(18px,2.2vw,26px);border-radius:999px;padding:14px 34px;box-shadow:0 0 0 6px rgba(5,221,77,.25)}
@media (orientation:portrait){.cover{background-image:url("assets/kv-portada.webp"),url("assets/kv-ondas.webp");background-size:100% auto,cover;background-position:center 30%,center}}
@media (prefers-reduced-motion:no-preference){.cover span{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(5,221,77,.08)}}.fade{animation:f .35s ease both}@keyframes f{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}

/* Intro: el caso de Jesús */
.intro{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px;align-items:start}
.intro .col{display:grid;gap:20px}
.case-card{background:rgba(10,46,34,.88);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:200px 1fr}
.case-card img{width:100%;height:100%;object-fit:cover;display:block;min-height:240px}
.case-card .tx{padding:18px 20px;display:grid;gap:10px;font-size:16px}
.case-card h3{font-size:30px}
.case-card h3 span{display:block;font-weight:400;color:var(--muted);font-size:18px;margin-top:2px}
.tag{display:inline-block;color:var(--gold);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.dx{margin:0;padding-left:20px;display:grid;gap:2px}
.goal{border-left:3px solid var(--gold);padding-left:12px;font-size:17px;margin:0}
.moments{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0;padding:0;list-style:none}
.moments li{background:rgba(10,46,34,.7);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:15px}
.moments b{display:block;color:var(--gold);font-variant-numeric:tabular-nums}
.how{display:grid;gap:8px;font-size:16px;margin:0;padding-left:20px}
.field{display:grid;gap:6px;flex:1 1 220px}
.field label{font-size:15px;color:var(--muted)}
.field input{font:inherit;font-size:20px;background:var(--panel);border:2px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 16px;width:100%}

/* Juego */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px;align-items:start}
.stage>.col{min-width:0;display:grid;gap:18px}
.route{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stop{border-top:4px solid var(--line);padding-top:8px;font-size:14px;color:var(--muted)}
.stop.on{border-color:var(--gold);color:var(--ink)}
.stop.done{border-color:var(--teal)}
.stop b{font-variant-numeric:tabular-nums}
.situ{background:rgba(10,46,34,.9);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,2.6vw,28px);display:grid;gap:14px}
.situ .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.situ .facts div{border-left:3px solid var(--teal);padding-left:12px;font-size:16px}
.situ .facts b{display:block;color:var(--gold);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.step h3{font-size:20px;color:var(--muted);font-weight:400;margin-bottom:12px}
.step h3 b{color:var(--ink)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.prod{position:relative;text-align:left;background:rgba(10,46,34,.9);border:2px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:8px;align-content:start;min-height:200px;transition:border-color .15s,transform .15s}
.prod .im{background:#fff;border-radius:10px;height:96px;display:grid;place-items:center;overflow:hidden}
.prod .im img{max-width:92%;max-height:88px;object-fit:contain}
.prod b{font-size:16px;line-height:1.2}
.prod small{font-size:13.5px;color:var(--muted);line-height:1.3}
.prod .mark{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;background:var(--bg);border:2px solid var(--line)}
.prod[aria-pressed="true"]{border-color:var(--gold);transform:translateY(-2px)}
.prod[aria-pressed="true"] .mark{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.prod[aria-pressed="true"] .mark::after{content:"✓"}
.prod.ok{border-color:var(--brand)}
.prod.ok .mark{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.prod.miss{border-color:var(--brand);border-style:dashed}
.prod.no{border-color:var(--bad)}
.prod.no .mark{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.prod.dim{opacity:.45}
.prod .note{font-size:13px;font-weight:700}
.prod.ok .note,.prod.miss .note{color:var(--brand)}
.prod.no .note{color:var(--bad)}
.prod:disabled{cursor:default;transform:none}
.verdict{border-radius:16px;padding:14px 18px;background:rgba(5,221,77,.12);border:1px solid rgba(5,221,77,.5);font-size:17px}
.verdict.mid{background:rgba(5,221,77,.12);border-color:rgba(5,221,77,.5)}
.who{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:16px;margin-bottom:10px}
.who i{font-style:normal;background:var(--teal);color:var(--bg);font-weight:700;border-radius:999px;padding:3px 12px;font-size:14px}
.opts{display:grid;gap:12px}
.choice{text-align:left;background:rgba(10,46,34,.9);border:2px solid var(--line);border-radius:16px;padding:16px 18px;min-height:64px;display:flex;gap:14px;align-items:flex-start;font-size:17.5px;line-height:1.4}
.choice:hover:not(:disabled){border-color:var(--gold)}
.choice .k{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px}
.choice.ok{border-color:var(--brand);background:rgba(5,221,77,.12)}
.choice.ok .k{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.choice.no{border-color:var(--bad);background:rgba(255,138,115,.1)}
.choice.no .k{border-color:var(--bad);color:var(--bad)}
.choice.dim{opacity:.45}
.choice:disabled{cursor:default}
.reveal{border-radius:20px;background:linear-gradient(120deg,#11735f,#1f6b3f);padding:clamp(18px,2.6vw,28px);display:grid;gap:14px}
.reveal .v{font-size:21px;font-weight:700}
.reveal .why{font-size:16px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:rgba(1,27,18,.4);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:28px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--gold)}
.stat span{font-size:15px}
.gains{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gains div{border-left:3px solid var(--gold);padding-left:12px;font-size:16px}
.gains em{display:block;font-style:normal;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}

/* Panel de Jesús */
.jesus{position:sticky;top:16px;background:rgba(10,46,34,.9);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid}
.jesus img{width:100%;height:240px;object-fit:cover;object-position:center 30%;display:block;transition:filter .6s}
.jesus .tx{padding:14px 16px;display:grid;gap:10px}
.jesus h3{font-size:20px}
.jesus h3 span{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:15px}
.checks li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.checks li i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.checks li.on{color:var(--ink)}
.checks li.on i{background:var(--brand);border-color:var(--brand)}
.checks li.half{color:var(--ink)}
.checks li.half i{background:var(--gold);border-color:var(--gold)}

/* Final */
.final{display:grid;gap:22px}
.endhero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:center}
.endhero img{width:100%;height:auto;border-radius:20px;aspect-ratio:1/1;object-fit:cover}
.score{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.score .big{font-size:clamp(64px,10vw,110px);font-weight:700;line-height:.9;color:var(--gold);font-variant-numeric:tabular-nums}
.badge{display:inline-block;background:var(--gold);color:var(--bg);font-weight:700;border-radius:999px;padding:6px 16px}
.outcomes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.outcomes div{background:rgba(10,46,34,.9);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px}
.outcomes b{display:block;color:var(--gold);font-size:18px}
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kit div{background:rgba(10,46,34,.9);border-radius:14px;padding:14px;border:1px solid var(--line);font-size:15.5px}
.kit b{display:block;color:var(--gold);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.board{background:rgba(10,46,34,.9);border-radius:16px;padding:16px 20px;border:1px solid var(--line)}
.board ol{margin:8px 0 0;padding:0;list-style:none;font-variant-numeric:tabular-nums}
.board li{padding:4px 0;display:flex;justify-content:space-between;gap:12px}
.board li.me{color:var(--gold);font-weight:700}
.closing{font-size:clamp(22px,2.6vw,30px);font-weight:700;margin:0}
.closing span{color:var(--gold)}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.flink{color:var(--gold);font-size:14px;padding:4px}
.dev{display:inline-flex;align-items:center;gap:8px}
.dev img{height:30px;width:auto}
.contact a{color:var(--muted)}
footer{align-items:center}
@media (max-width:960px){.intro,.stage,.endhero{grid-template-columns:1fr}.jesus{position:static;grid-template-columns:120px 1fr}.jesus img{height:100%;min-height:140px}.endhero img{max-width:260px}}
@media (max-width:700px){.case-card{grid-template-columns:1fr}.case-card img{max-height:260px}.moments,.route{grid-template-columns:repeat(2,1fr)}.situ .facts,.gains,.outcomes{grid-template-columns:1fr}.hud{gap:12px}}
@media (max-width:600px){.lockup span{display:none}.hud{font-size:14px}.hud b{font-size:17px}.cover span{font-size:17px;padding:12px 22px}}

/* Celular: letra más grande para mejor lectura */
@media (max-width:700px){
  body{font-size:19px}
  .lede{font-size:19px}
  .step h3{font-size:23px;line-height:1.3}
  .situ .facts{grid-template-columns:1fr}
  .situ .facts div{font-size:18px}
  .situ .facts b{font-size:14px}
  .prod b{font-size:18px}
  .prod small{font-size:16px;line-height:1.35}
  .prod .note{font-size:15px}
  .who{font-size:18px}
  .who i{font-size:15px}
  .choice{font-size:19.5px;line-height:1.45;padding:16px}
  .choice .k{width:36px;height:36px;font-size:16px}
  .verdict{font-size:19px}
  .reveal .v{font-size:22px}
  .reveal .why{font-size:18px}
  .stat span{font-size:17px}
  .gains div{font-size:18px}
  .gains{grid-template-columns:1fr}
  .case-card .tx{font-size:18px}
  .goal{font-size:18px}
  .how{font-size:18px}
  .moments li{font-size:16px}
  .stop{font-size:15px}
  .kit div,.outcomes div,.dl p{font-size:17.5px}
  .outcomes{grid-template-columns:1fr}
}
</style>
</head>

  <header>

const API={url:"https://tovzbcwwdxueejgidoze.supabase.co/rest/v1/rpc/",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvdnpiY3d3ZHh1ZWVqZ2lkb3plIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MDA0NzAsImV4cCI6MjEwODI3NjQ3MH0.dHKHFpeYk00g93FEEF4BW5xzzHgXXQgg69ejzW0rWak"};
async function rpc(fn,body){
  const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),6000);
  try{ const r=await fetch(API.url+fn,{method:"POST",signal:ctl.signal,headers:{"apikey":API.key,"Authorization":"Bearer "+API.key,"Content-Type":"application/json"},body:JSON.stringify(body||{})});
    if(!r.ok){ const e=new Error("http "+r.status); e.status=r.status; throw e; } return await r.json(); } finally{ clearTimeout(t); }
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function play(){
  renderHud();
  const k=ROUTE[S.i], M=MOM[k];
  S.cur={picked:new Set(), shelf:shuffle(M.shelf), pitch:shuffle(M.pitch)};
  view.innerHTML=`<div class="stage"><div class="col">

   <article class="situ fade">

   </article>
   <section class="step" id="s1">
     <h3><b>Paso 1.</b> Arma la solución integral: toca todos los productos que Jesús necesita en este momento.</h3>
     <div class="shelf">${S.cur.shelf.map(id=>`<button class="prod" type="button" data-p="${id}" aria-pressed="false"><span class="mark" aria-hidden="true"></span><span class="im"><img src="${img(id)}" alt=""></span><b>${P[id].n}</b><small>${P[id].d}</small><span class="note"></span></button>`).join("")}</div>

   </section>
   <section class="step hidden" id="s2"></section>
   <section id="rv"></section>
  </div>${jesusPanel()}</div>`;
  view.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.p; const on=!S.cur.picked.has(id);
    on?S.cur.picked.add(id):S.cur.picked.delete(id); b.setAttribute("aria-pressed",on);
    const n=S.cur.picked.size; document.getElementById("cnt").textContent=n+(n===1?" seleccionado":" seleccionados");
    document.getElementById("ok1").disabled=n===0;
  });
  document.getElementById("ok1").onclick=checkShelf;
  window.scrollTo({top:0});
}

function checkShelf(){
  const k=ROUTE[S.i], M=MOM[k];
  let hits=0, wrong=0; const need=M.shelf.filter(id=>P[id].m===k).length;
  view.querySelectorAll("[data-p]").forEach(b=>{
    const id=b.dataset.p, picked=S.cur.picked.has(id), right=P[id].m===k, note=b.querySelector(".note"), mark=b.querySelector(".mark");
    b.disabled=true; b.removeAttribute("aria-pressed");
    if(picked&&right){hits++; b.classList.add("ok"); mark.textContent="✓"; note.textContent="Correcto";}
    else if(picked&&!right){wrong++; b.classList.add("no"); mark.textContent="✕"; note.textContent="Su momento es "+MOM[P[id].m].n;}
    else if(!picked&&right){b.classList.add("miss"); note.textContent="Faltó en la solución";}
    else b.classList.add("dim");
  });
  const full=hits===need&&wrong===0;
  const pts=Math.max(0,hits*PTS.pick-wrong*PTS.wrong)+(full?PTS.full:0);
  S.score+=pts; S.cur.full=full; renderHud();
  document.getElementById("ok1").parentElement.outerHTML=`<div class="verdict ${full?"":"mid"}" role="status">${full?`Solución integral completa: ${hits} de ${need}. +${pts}`:`Encontraste ${hits} de ${need}${wrong?` y elegiste ${wrong} de otro momento`:""}. +${pts}. Las que faltaron están marcadas con borde punteado.`}</div>`;
  const s2=document.getElementById("s2"); s2.classList.remove("hidden"); s2.classList.add("fade");
  s2.innerHTML=`<h3><b>Paso 2.</b> Ahora explícaselo a tu cliente. ¿Qué le dices?</h3>
   <div class="who"><i>Cliente</i>${M.who}</div>
   <div class="opts">${S.cur.pitch.map((o,i)=>`<button class="choice" type="button" data-a="${i}"><span class="k">${"ABC"[i]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>`;
  s2.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>pickPitch(+b.dataset.a));
  s2.scrollIntoView({behavior:smooth(),block:"start"});
}

function pickPitch(i){
  const k=ROUTE[S.i], M=MOM[k], o=S.cur.pitch[i], ok=!!o.ok;
  if(ok) S.score+=PTS.pitch;
  document.querySelectorAll("[data-a]").forEach(b=>{b.disabled=true; const oo=S.cur.pitch[+b.dataset.a];
    b.classList.add(oo.ok?"ok":(+b.dataset.a===i?"no":"dim"));});
  S.log.push({k, full:S.cur.full, pitchOk:ok}); renderHud();
  const jp=document.getElementById("jp"); if(jp) jp.outerHTML=jesusPanel();
  const last=S.i===ROUTE.length-1, rv=document.getElementById("rv");
  rv.innerHTML=`<div class="reveal fade" role="status">
    <div class="v">${ok?"Así se explica una solución integral. +"+PTS.pitch:"Ese argumento no convence a tu cliente."}</div>
    ${ok?`<p class="why">Parte del riesgo de Jesús, une los productos en una sola respuesta y cierra con el resultado.</p>`:`<p class="why">${esc(o.why)}</p>`}

  </div>`;
  document.getElementById("nx").onclick=()=>{ if(last) finish(); else {S.i++; play();} };
  rv.scrollIntoView({behavior:smooth(),block:"start"});
}

     <p class="eyebrow">${esc(S.name)}${S.company?" · "+esc(S.company):""}</p>

   <div><p class="eyebrow">Desafío clínico central</p><h2 style="margin:6px 0 12px">Optimizar los resultados de Jesús con un manejo integral</h2>
     <div class="outcomes"><div><b>Cicatrización efectiva</b>de sus heridas y defectos de cobertura</div><div><b>Menos complicaciones</b>asociadas a su cuidado</div><div><b>Menos reintervenciones</b>infecciones y estancia hospitalaria prolongada</div></div></div>
   <div><h2 style="margin-bottom:12px">Tu kit para explicar la solución integral</h2>
     <div class="kit">${ROUTE.map((k,i)=>`<div><b>0${i+1} · ${MOM[k].n}</b>${MOM[k].kit}</div>`).join("")}</div></div>
   <p class="closing">Un paciente. Muchas decisiones. <span>Un mejor mañana, juntos.</span></p>
   <div class="board"><h3>Ranking · <a href="ranking.html" class="flink">Ver en pantalla completa</a></h3>
     <ol id="boardList"><li><span>Cargando el ranking del stand…</span></li></ol><p id="boardNote" style="margin:8px 0 0;font-size:14px;color:var(--muted)"></p></div>
   <div class="dl"><a class="btn gold" href="raspa.html">🎁 Raspa y gana</a><p>Si quedas entre los 10 primeros, al cierre del reto descubres aquí tu premio. Vuelve a esta opción desde este mismo celular cuando lo anuncien en el stand.</p></div>
   <div class="dl"><a class="btn gold" href="assets/informe-caso-jesus.pdf" download="Informe-caso-Jesus-Innovation-Day.pdf">⬇ Descarga ingreso INNOVATION DAY</a><p>Llévate en tu celular la infografía del recorrido de Jesús: los 4 momentos, las soluciones de Solventum y las cifras clave.</p></div>

  </section>`;
  document.getElementById("again").onclick=cover;

}

  ol.innerHTML=rows.map((b,ix)=>`<li class="${b.me?"me":""}"><span>${ix+1}. ${esc(b.n)}${b.c?" · "+esc(b.c):""}</span><span>${b.p}</span></li>`).join("")||"<li><span>Aún no hay partidas.</span></li>";
  document.getElementById("boardNote").textContent=online?"Ranking en vivo de todos los dispositivos del stand.":"Sin conexión: se muestran solo las partidas de este dispositivo. Tu puntaje se guardó aquí.";
}

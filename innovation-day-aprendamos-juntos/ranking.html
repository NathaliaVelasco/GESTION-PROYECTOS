<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking · Innovation Day · Aprendamos juntos</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Pantalla de ranking: key visual Channel Annual Meeting, mapa a la derecha */
  --bg:#011B12; --panel:rgba(10,46,34,.85); --ink:#FFFFFF; --muted:#BFFDE3;
  --brand:#05DD4D; --gold:#DCC369; --line:rgba(220,195,105,.28);
  --font:"Figtree", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg) url("assets/kv-fondo.webp") no-repeat right center/cover;color:var(--ink);font-family:var(--font)}
.wrap{min-height:100%;display:flex;flex-direction:column;gap:20px;padding:24px clamp(16px,4vw,56px);background:linear-gradient(90deg,rgba(1,27,18,.95) 0%,rgba(1,27,18,.85) 42%,rgba(1,27,18,.15) 100%)}
@media (orientation:portrait){body{background-image:url("assets/kv-ondas.webp")}.wrap{background:rgba(1,27,18,.72)}}
header{display:flex;align-items:center;gap:16px}
header img{height:32px;width:auto}
header span{border-left:1px solid var(--line);padding-left:16px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;line-height:1.3}
header em{display:block;font-style:normal;letter-spacing:.04em;text-transform:none;color:var(--gold);font-size:14px}
h1{margin:0;font-size:clamp(36px,5vw,64px);line-height:1;font-weight:700;text-wrap:balance}
h1 b{color:var(--gold)}
.sub{margin:8px 0 0;color:var(--muted);font-size:clamp(16px,1.8vw,20px)}
ol{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:760px}
li{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(6px,0.9vh,12px) 20px;font-size:clamp(17px,2.2vh,24px)}
li .pos{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;font-size:1.2em}
li .who small{display:block;color:var(--muted);font-size:.7em}
li .pts{font-weight:700;font-variant-numeric:tabular-nums}
li:first-child{border-color:var(--gold);background:linear-gradient(90deg,rgba(220,195,105,.22),var(--panel))}
li:first-child .pts{color:var(--gold)}
li.new{animation:glow 1.6s ease}
@media (prefers-reduced-motion:reduce){li.new{animation:none}}
@keyframes glow{from{box-shadow:0 0 0 4px var(--gold)}to{box-shadow:none}}
.empty{max-width:760px;background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:28px;color:var(--muted);font-size:20px}
footer{margin-top:auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:12px}
footer a,footer button{color:var(--gold);background:none;border:0;font:inherit;cursor:pointer;padding:4px;text-decoration:underline}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="assets/logo-blanco.png" alt="Solventum"><span>Channel Annual Meeting<em>El arte de construir grandes alianzas</em></span></header>
  <div>
    <h1>Ranking <b>Cierra el caso</b></h1>
    <p class="sub">Los distribuidores que mejor conectan cada etapa del viaje del paciente con su solución integral.</p>
  </div>
  <div id="list" aria-live="polite"></div>
  <footer>
    <span>25 y 26 de noviembre de 2026 · Hotel Marriott, Bogotá · Experiencia diseñada por Simoné</span>
    <span><a href="./">Volver al juego</a> · <button id="reset" type="button">Borrar ranking</button></span>
  </footer>
</div>
<script>
const BKEY = "innovation-day-aprendamos-juntos-ranking";
let seen = new Set();
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function load(){ try{ return JSON.parse(localStorage.getItem(BKEY)) || []; }catch(e){ return []; } }
function render(){
  const b = load(); const el = document.getElementById("list");
  if(!b.length){ el.innerHTML = '<p class="empty">Aún no hay partidas. El primer distribuidor que cierre los cuatro casos aparecerá aquí.</p>'; seen = new Set(); return; }
  const first = seen.size===0;
  el.innerHTML = '<ol>' + b.map((r,i)=>{
    const id = r.t+"|"+r.n; const isNew = !first && !seen.has(id);
    return `<li class="${isNew?"new":""}"><span class="pos">${i+1}</span><span class="who">${esc(r.n)}${r.c?`<small>${esc(r.c)}</small>`:""}</span><span class="pts">${r.p}</span></li>`;
  }).join("") + '</ol>';
  seen = new Set(b.map(r=>r.t+"|"+r.n));
}
render();
window.addEventListener("storage", e=>{ if(e.key===BKEY) render(); });
setInterval(render, 4000);
document.getElementById("reset").onclick = function(){
  if(this.dataset.armed){ try{ localStorage.removeItem(BKEY); }catch(e){} delete this.dataset.armed; this.textContent="Borrar ranking"; render(); return; }
  this.dataset.armed="1"; this.textContent="Toca otra vez para confirmar";
  setTimeout(()=>{ if(this.dataset.armed){ delete this.dataset.armed; this.textContent="Borrar ranking"; } },4000);
};
</script>
</body>
</html>

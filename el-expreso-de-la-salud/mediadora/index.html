/* Plan: herramienta de trabajo en celular o tablet, en vivo. Fondo claro para leer bajo luz de salón,
   verde oscuro Solventum para la estructura, color de cada grupo como franja, cronómetro grande. */
:root{--night:#01332B;--brand:#05DD4D;--brand-d:#0A9A3C;--bg:#EEF3F1;--card:#FFFFFF;--ink:#13221F;--muted:#5F6B68;--line:#D9E3DF;--gold:#19A591;--bad:#C2412D;
  --f:"Solve Pro","Avenir Next","Segoe UI",system-ui,sans-serif;--mono:"Solve Pro","Avenir Next","Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.4}
h1,h2,h3{margin:0;font-weight:600;color:var(--night);text-wrap:balance}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.bar{position:sticky;top:0;z-index:5;background:var(--night);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 16px}
.bar img{height:24px}
.bar .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap}
.live{font-family:var(--mono);font-size:11px;color:#BFFDE3}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.kick{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.04em;color:var(--brand-d)}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.login{max-width:380px;margin:10vh auto}
.login input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0}
.btn{border:0;border-radius:10px;padding:12px 14px;background:var(--brand);color:var(--night);font-weight:600;width:100%}
.btn.dark{background:var(--night);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--night)}
.btn.no{background:#F6E1DD;color:#8A2416}
.btn.mid{background:#0C9457;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.err{color:var(--bad);font-size:13px;min-height:18px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.vbtn{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center}
.vbtn img{width:58px;height:58px;object-fit:contain}
.vbtn b{display:block;color:var(--night)}
.vbtn small{color:var(--muted)}
.layout{display:grid;gap:14px}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1fr) 380px;align-items:start}.side{position:sticky;top:64px}}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.g{border:2px solid transparent;background:#fff;border-radius:14px;padding:12px 12px 10px;text-align:left;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.g::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gc)}
.g.sel{border-color:var(--night)}
.g h3{font-size:16px;display:flex;justify-content:space-between;gap:6px}
.g .row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#EEF3F1;color:var(--muted);margin:6px 4px 0 0}
.chip.ok{background:#DDF7E6;color:#19A591}.chip.no{background:#F6E1DD;color:#8A2416}.chip.run{background:#BFFDE3;color:#01332B}
.timer{font-family:var(--mono);font-size:64px;font-weight:600;text-align:center;line-height:1;color:var(--night);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--gold)}.timer.over{color:var(--bad)}
.tlabel{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
.tbar{height:8px;background:#E3EBE8;border-radius:4px;overflow:hidden;margin:10px 0 12px}.tbar i{display:block;height:100%;background:var(--brand);transition:width .25s linear}
.step{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.step h3{font-size:15px;margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stack{display:flex;flex-direction:column;gap:8px}
.ans{background:#F5F8F7;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:15px;min-height:44px;white-space:pre-wrap}
.key{font-size:14px}
.key ul{margin:6px 0 0;padding-left:18px}
.key .ok{color:#19A591;font-weight:600}
details summary{cursor:pointer;font-weight:600;color:var(--night)}
.note{font-size:12px;color:var(--muted)}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;text-align:center;margin-top:8px}
.res div{background:#F5F8F7;border-radius:10px;padding:8px 4px;font-size:11px;color:var(--muted)}
.res b{display:block;font-size:20px;color:var(--night)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const $=s=>document.querySelector(s);
const st={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v)}catch(e){}}};

async function rpc(fn,body){const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);return r.json()}
const mmss=s=>`${Math.floor(Math.max(s,0)/60)}:${String(Math.max(s,0)%60).padStart(2,"0")}`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.3);o.start(a.currentTime+t);o.stop(a.currentTime+t+.3)})}catch(e){}}

/* acceso */
$("#lf").onsubmit=async e=>{e.preventDefault();const c=$("#clave").value.trim();$("#lerr").textContent="Verificando…";
  try{const r=await rpc("mediadora_estado",{p_clave:c,p_vagon:1});if(r&&r.error){$("#lerr").textContent="La clave no es correcta.";return}
    clave=c;st.set("med_clave",c);start()}catch(err){$("#lerr").textContent="No se pudo conectar. Revisa el wifi o los datos."}};
$("#bOut").onclick=()=>{clave=null;st.set("med_clave",null);stopAll();$("#app").classList.add("hidden");$("#login").classList.remove("hidden")};
$("#bVag").onclick=()=>{vag=0;st.set("med_vag",null);sel=null;stopAll();pickVag()};
function stopAll(){if(pollId)clearInterval(pollId);if(tickId)clearInterval(tickId);pollId=tickId=null}
function start(){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");vag?board():pickVag()}

/* escoger vagón */
function pickVag(){
  $("#title").textContent="Panel del facilitador Solventum";$("#bVag").classList.add("hidden");$("#live").textContent="";
  $("#main").innerHTML=`<div class="kick">Paso 1</div><h1 style="font-size:24px;margin-top:4px">¿En qué vagón estás?</h1>
   <div class="vgrid">${CARS.map(c=>`<button class="vbtn" data-v="${c.n}"><img src="${PINS[c.n-1]}" alt=""><span><small>VAGÓN ${c.n} · ${c.p}</small><b>${c.s}</b></span></button>`).join("")}</div>`;
  document.querySelectorAll(".vbtn").forEach(b=>b.onclick=()=>{vag=+b.dataset.v;st.set("med_vag",vag);board()});
}

/* tablero del vagón */
async function poll(){try{const r=await rpc("mediadora_estado",{p_clave:clave,p_vagon:vag});if(r&&r.error){$("#bOut").click();return}data=r||[];polled=Date.now();$("#live").textContent="En vivo";renderGroups();renderSide(false)}catch(e){$("#live").textContent="Sin conexión"}}
function rem(g){if(!g||g.restante==null)return null;return Math.max(0,g.restante-Math.floor((Date.now()-polled)/1000))}
function board(){
  const c=CARS[vag-1];$("#title").textContent=`Vagón ${c.n} · ${c.s}`;$("#bVag").classList.remove("hidden");
  $("#main").innerHTML=`<div class="layout"><div class="stack" style="gap:14px">
    <div class="card"><div class="kick">Vagón ${c.n} · ${c.p}</div><h1 style="font-size:22px;margin-top:4px">${c.s}</h1>
      <p class="note" style="margin:6px 0 0">Toca el grupo que llegó a tu vagón para controlar sus tiempos y validar sus respuestas.</p></div>
    <div class="groups" id="groups"></div>
    <div class="card key"><details><summary>Clave de respuestas del vagón</summary>
      <p style="margin:10px 0 4px"><b>Caso:</b> ${c.c}</p>
      <p style="margin:10px 0 4px"><b>Individual:</b> ${c.iq}</p><ul>${c.io.map((o,i)=>`<li class="${i===c.ia?"ok":""}">${L[i]}) ${o}${i===c.ia?" ✔":""}</li>`).join("")}</ul>
      <p style="margin:10px 0 4px"><b>Grupal:</b> ${c.gq}</p><ul>${c.gk.map(k=>`<li>${k}</li>`).join("")}</ul>
      <p style="margin:10px 0 4px"><b>${c.n===1?"Títulos de las fichas":"Palabras del rompecabezas"}:</b> ${c.w.join(" · ")}</p></details></div>
  </div><div class="side" id="side"></div></div>`;
  stopAll();poll();pollId=setInterval(poll,3000);tickId=setInterval(()=>{renderGroups();renderSide(true)},500);renderSide(false);
}
function status(g){
  const out=[];const r=rem(g);
  if(g.fase&&r!=null)out.push(`<span class="chip run">${{individual:"Individual",grupal:"Grupal",rompecabezas:"Rompecabezas"}[g.fase]} ${mmss(r)}</span>`);
  out.push(g.grupal==null?(g.respuesta?`<span class="chip run">Grupal por validar</span>`:`<span class="chip">Grupal sin enviar</span>`):`<span class="chip ${g.grupal?"ok":"no"}">Grupal ${g.grupal?"correcta":"incorrecta"}</span>`);
  out.push(g.rompecabezas==null?`<span class="chip">${vag===1?"Fichas":"Rompecabezas"} pendiente</span>`:`<span class="chip ${g.rompecabezas?"ok":"no"}">${vag===1?"Fichas":"Rompecabezas"} ${g.rompecabezas?"a tiempo":"no completó"}</span>`);
  return out.join("");
}
function renderGroups(){const el=$("#groups");if(!el)return;
  el.innerHTML=GROUPS.map((gr,i)=>{const g=data.find(x=>x.grupo===i)||{grupo:i};
    return `<button class="g ${sel===i?"sel":""}" style="--gc:${gr[1]}" data-g="${i}"><h3>${gr[0]}<small class="note">${g.integrantes??0} personas</small></h3>
      <div class="row"><span>Individual respondida</span><b>${g.respondieron??0}/${g.integrantes??0}</b></div>${status(g)}</button>`}).join("");
  el.querySelectorAll(".g").forEach(b=>b.onclick=()=>{sel=+b.dataset.g;renderGroups();renderSide(false);if(innerWidth<900)$("#side").scrollIntoView({behavior:"smooth"})});
}
let lastSideKey="";
function renderSide(tickOnly){
  const el=$("#side");if(!el)return;
  if(sel==null){el.innerHTML=`<div class="card"><p class="note" style="margin:0">Escoge un grupo para ver su cronómetro y sus validaciones.</p></div>`;lastSideKey="";return}
  const gr=GROUPS[sel],g=data.find(x=>x.grupo===sel)||{grupo:sel},r=rem(g),dur={individual:120,grupal:180,rompecabezas:180}[g.fase]||0;
  const key=JSON.stringify([sel,g.fase,g.respuesta,g.grupal,g.rompecabezas,g.bono,g.respondieron,g.integrantes]);
  if(tickOnly&&key===lastSideKey){const t=$("#tm");if(t){t.textContent=g.fase&&r!=null?mmss(r):"0:00";t.className="timer"+(r===0?" over":r!=null&&r<=30?" warn":"");$("#tb").style.width=(dur&&r!=null?r/dur*100:0)+"%";
      if(g.fase==="rompecabezas"&&r!=null){const p2=$("#p2");if(p2)p2.disabled=r<60}
      if(g.fase&&r===0&&!beeped[sel+g.fase]){beeped[sel+g.fase]=1;beep()}}return}
  lastSideKey=key;
  el.innerHTML=`<div class="card" style="border-top:6px solid ${gr[1]}"><div class="kick">Grupo ${gr[0]}</div>
    <div class="timer ${r===0?"over":r!=null&&r<=30?"warn":""}" id="tm" style="margin-top:10px">${g.fase&&r!=null?mmss(r):"0:00"}</div>
    <div class="tlabel">${g.fase?{individual:"Pregunta individual · 2 minutos",grupal:"Pregunta grupal · 3 minutos",rompecabezas:(vag===1?"Fichas":"Rompecabezas")+" · 3 minutos"}[g.fase]:"Ningún cronómetro activo"}</div>
    <div class="tbar"><i id="tb" style="width:${dur&&r!=null?r/dur*100:0}%"></i></div>
    <div class="step"><h3>1. Pregunta individual</h3><p class="note" style="margin:0 0 8px">${g.respondieron??0} de ${g.integrantes??0} personas ya respondieron en su celular.</p>
      <button class="btn dark" data-f="individual" data-s="120">Iniciar 2:00</button></div>
    <div class="step"><h3>2. Pregunta grupal</h3><button class="btn dark" data-f="grupal" data-s="180">Iniciar 3:00</button>
      <p class="note" style="margin:10px 0 4px">Respuesta enviada${g.respondio?` por ${esc(g.respondio)}`:""}:</p><div class="ans">${g.respuesta?esc(g.respuesta):"Todavía no han enviado la respuesta."}</div>
      <div class="two" style="margin-top:8px"><button class="btn" id="gy">Correcta · 4</button><button class="btn no" id="gn">Incorrecta · 0</button></div></div>
    <div class="step"><h3>3. ${vag===1?"Fichas de valoración":"Rompecabezas"}</h3><button class="btn dark" data-f="rompecabezas" data-s="180">Iniciar 3:00</button>
      <div class="stack" style="margin-top:8px"><button class="btn" id="p3">Completo en 3 min o menos · 4</button><button class="btn no" id="pn">No completó · 0</button></div></div>
    <div class="step"><h3>Resultado del grupo</h3><div class="res"><div><b>${g.grupal==null?"–":g.grupal}</b>Grupal</div><div><b>${g.rompecabezas==null?"–":g.rompecabezas}</b>${vag===1?"Fichas":"Rompecabezas"}</div></div>
      <p class="note" style="margin:8px 0 0">Los puntos llegan a todas las personas del grupo. Cada una suma además su pregunta individual.</p></div>
    <p class="err" id="serr" aria-live="polite"></p></div>`;
  el.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>act(()=>rpc("mediadora_fase",{p_clave:clave,p_vagon:vag,p_grupo:sel,p_fase:b.dataset.f,p_seg:+b.dataset.s})));
  $("#gy").onclick=()=>act(()=>rpc("mediadora_registrar",{p_clave:clave,p_vagon:vag,p_grupo:sel,p_grupal:4,p_rompecabezas:null,p_bono:null}));
  $("#gn").onclick=()=>act(()=>rpc("mediadora_registrar",{p_clave:clave,p_vagon:vag,p_grupo:sel,p_grupal:0,p_rompecabezas:null,p_bono:null}));
    $("#p3").onclick=()=>act(()=>rpc("mediadora_registrar",{p_clave:clave,p_vagon:vag,p_grupo:sel,p_grupal:null,p_rompecabezas:4,p_bono:false}));
  $("#pn").onclick=()=>act(()=>rpc("mediadora_registrar",{p_clave:clave,p_vagon:vag,p_grupo:sel,p_grupal:null,p_rompecabezas:0,p_bono:false}));
}
async function act(fn){$("#serr").textContent="";document.querySelectorAll("#side button").forEach(b=>b.disabled=true);
  try{const ok=await fn();if(ok===false)$("#serr").textContent="No se pudo guardar. Vuelve a entrar con tu clave.";delete beeped[sel+"individual"];delete beeped[sel+"grupal"];delete beeped[sel+"rompecabezas"];await poll()}
  catch(e){$("#serr").textContent="Sin conexión: no se guardó. Intenta de nuevo."}
  lastSideKey="";renderSide(false)}
if(clave)start();
</script>
</body>
</html>

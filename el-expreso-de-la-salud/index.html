/* Plan: un solo mundo visual nocturno de andén. Verde oscuro Solventum como noche, verde de marca como señal,
   madera para taquilla y puerta, papel crema para el boleto. Columna de celular centrada (máx. 440 px). */
:root{
  --night:#01332B; --deep:#011F1A; --brand:#05DD4D; --teal:#19A591; --mint:#BFFDE3;
  --paper:#FFFFFF; --ink:#0B201C; --wood:#01332B; --wood-d:#01332B; --wood-l:#19A591;
  --muted:#8FB5AA; --line:rgba(191,253,227,.16); --bad:#FF8A7A; --gold:#1CCF93;
  --f-display:"Solve Pro","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Solve Pro","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-mono:"Solve Pro","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--deep);color:#EAF7F1;font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(120% 60% at 50% -10%,#03463B 0%,var(--deep) 60%)}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,.av:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--night);
  box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.5)}
/* barra superior */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;
  background:rgba(1,51,43,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top img.solv{height:26px;margin-right:6px}
.top .ttl{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.02em;flex:1;color:var(--mint)}
.chip{display:flex;align-items:center;gap:8px;padding:3px 10px 3px 3px;border-radius:99px;background:rgba(5,221,77,.12);
  border:1px solid rgba(5,221,77,.35);font-size:13px;font-variant-numeric:tabular-nums}
.chip img{width:26px;height:26px;border-radius:50%}
.chip b{color:var(--brand)}
/* barra de demo */
.demo{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:var(--deep);border-bottom:1px solid var(--line);font-size:12px}
.demo span{color:var(--muted);white-space:nowrap;align-self:center;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.demo button{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--mint);border-radius:99px;padding:4px 10px;font-size:12px}
.demo button.on{background:var(--mint);color:var(--night);border-color:var(--mint)}
main{flex:1;padding:0 0 32px}
.pad{padding:0 16px}
.scene{display:block;width:100%;height:auto}
.scene.booth{height:250px}.scene.platform{height:230px}
.kicker{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.04em;color:var(--brand)}
.lead{color:#CFE6DD;margin:6px 0 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;background:var(--brand);color:var(--night);
  font-family:var(--f-display);font-weight:600;font-size:16px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--mint);border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:rgba(1,31,26,.65);border:1px solid var(--line);border-radius:16px;padding:16px}
/* avatares */
.avgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.av{border:0;background:transparent;padding:0;color:#CFE6DD;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.av img{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid transparent;transition:transform .15s}
.av:hover img{transform:scale(1.05)}
.av.sel img{border-color:var(--brand);box-shadow:0 0 0 3px rgba(5,221,77,.3)}
.av.taken{cursor:not-allowed}
.av.taken img{filter:grayscale(1) brightness(.45)}
.av.taken::after{content:"Ocupado";position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:9px;
  background:var(--deep);color:var(--muted);padding:1px 5px;border-radius:4px}
.groups{display:flex;flex-wrap:wrap;gap:8px}
.grp{border:2px solid transparent;border-radius:99px;padding:6px 12px 6px 8px;background:rgba(255,255,255,.06);color:#EAF7F1;display:flex;align-items:center;gap:6px;font-size:14px}
.grp i{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.4)}
.grp.sel{border-color:var(--brand)}
/* preguntas */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog{display:flex;gap:4px;margin:10px 0 4px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.prog i.done{background:var(--brand)}
.prog i.now{background:var(--mint)}
.q{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.3;margin:10px 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#EAF7F1;border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.opt b{font-family:var(--f-mono);color:var(--muted);font-weight:600}
.opt:hover{border-color:rgba(5,221,77,.6)}
.opt.ok{border-color:var(--brand);background:rgba(5,221,77,.14)}
.opt.ok b{color:var(--brand)}
.opt.no{border-color:var(--bad);background:rgba(255,138,122,.12)}
.opt[disabled]{cursor:default}
.feedback{font-size:14px;margin-top:10px;min-height:20px}
.feedback.ok{color:var(--brand)} .feedback.no{color:var(--bad)}
/* taquilla: pregunta en la ventanilla */
.window{background:linear-gradient(#0A4A3E,#01332B);border-radius:18px 18px 12px 12px;padding:12px;margin-top:-6px;box-shadow:inset 0 0 0 2px rgba(5,221,77,.55),0 12px 30px rgba(0,0,0,.35);border-top:6px solid #05DD4D}
.window .glass{background:var(--paper);color:var(--ink);border-radius:10px;padding:16px}
.window .glass .q{color:var(--ink)}
.window .glass .opt{background:#fff;color:var(--ink);border-color:#E7E7E7}
.window .glass .opt b{color:#19A591}
.window .glass .opt.ok{background:#DDF7E6;border-color:#0A9A3C}
.window .glass .opt.ok b{color:#0A9A3C}
.window .glass .opt.no{background:#FCE3DF;border-color:#D4533F}
.window .glass .kicker{color:#19A591}
.window .glass .prog i{background:#E7E7E7}.window .glass .prog i.done{background:#0A9A3C}.window .glass .prog i.now{background:#01332B}
.window .glass .feedback.ok{color:#19A591}.window .glass .feedback.no{color:#B93C2A}
/* boleto */
.ticket{position:relative;display:grid;grid-template-columns:1fr 92px;background:var(--paper);color:var(--ink);border-radius:12px;overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,.35)}
.ticket::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,var(--brand) 0 18px,transparent 18px 26px)}
.ticket .main{padding:18px 14px 14px 16px;display:flex;flex-direction:column;gap:8px}
.ticket .stub{border-left:2px dashed #1CCF93;padding:18px 10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;gap:6px}
.ticket .stub img{width:54px;height:54px;border-radius:50%}
.ticket .row{display:flex;gap:10px;align-items:center}
.ticket .row img.lp{height:28px}
.ticket .mono{font-family:var(--f-mono);font-size:11px;color:#01332B;letter-spacing:.06em;text-transform:uppercase}
.ticket .big{font-family:var(--f-display);font-weight:600;font-size:22px;color:var(--night)}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:8px;border:1.5px dashed #1CCF93;display:grid;place-items:center;position:relative;font-family:var(--f-mono);font-size:10px;color:#19A591}
.slot img{width:92%;height:92%;object-fit:contain}
.slot.punch::after{content:"";position:absolute;right:-4px;top:-4px;width:12px;height:12px;border-radius:50%;background:var(--night);box-shadow:0 0 0 2px var(--paper)}
.slot.won{border-style:solid;border-color:var(--brand)}
/* mapa del tren */
.rail{display:flex;gap:10px;overflow-x:auto;padding:8px 16px 18px;scroll-snap-type:x mandatory}
.carbtn{scroll-snap-align:start;flex:0 0 78%;border:0;padding:0;background:transparent;color:inherit;text-align:left}
.car{position:relative;background:linear-gradient(#0A5546,#01332B);border-radius:22px 22px 10px 10px;padding:14px 14px 26px;border:1px solid rgba(191,253,227,.22)}
.car .wins{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.car .wins i{height:30px;border-radius:6px;background:linear-gradient(#BFFDE3,#7EDDBE);opacity:.85}
.car .wheels{position:absolute;bottom:-10px;left:18px;right:18px;display:flex;justify-content:space-between}
.car .wheels i{width:22px;height:22px;border-radius:50%;background:#0B201C;border:4px solid #3E5A53}
.car .num{font-family:var(--f-mono);font-size:12px;color:var(--brand);letter-spacing:.1em}
.car h3{font-size:18px;margin-top:2px}
.car .prod{font-size:13px;color:var(--muted)}
.car .pinp{position:absolute;right:12px;top:10px;width:58px;height:58px;object-fit:contain;filter:grayscale(1) opacity(.35)}
.car.won .pinp{filter:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--mint)}
.pill.won{background:rgba(5,221,77,.18);color:var(--brand)}
.pill.transit{background:rgba(242,193,78,.16);color:var(--gold)}
.track{height:6px;margin:0 16px;background:repeating-linear-gradient(90deg,#3E5A53 0 14px,transparent 14px 22px);border-top:2px solid #3E5A53}
/* vagón */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 12px}
.steps div{font-size:11px;text-align:center;padding:6px 2px;border-radius:8px;background:rgba(255,255,255,.05);color:var(--muted)}
.steps div.now{background:var(--mint);color:var(--night);font-weight:600}
.steps div.done{background:rgba(5,221,77,.16);color:var(--brand)}
.case{font-size:14px;color:#CFE6DD;border-left:3px solid var(--brand);padding-left:12px}
textarea{width:100%;min-height:84px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#EAF7F1;padding:12px;font:inherit;resize:vertical}
.facil{border:1px dashed rgba(242,193,78,.55);border-radius:14px;padding:14px;background:rgba(242,193,78,.06)}
.facil .kicker{color:var(--gold)}
.facil ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:#E7E7E7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.okb{background:var(--brand)} .btn.nob{background:#2A403B;color:#FFD6CF}
.timer{font-family:var(--f-mono);font-size:56px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;color:var(--mint);line-height:1}
.timer.warn{color:var(--gold)} .timer.over{color:var(--bad)}
.ring{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0}
.ring i{display:block;height:100%;background:var(--brand);transition:width .25s linear}
.puzzle{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;aspect-ratio:35/25;border-radius:10px;overflow:hidden;background:#0B201C;padding:3px;position:relative}
.puzzle i{background:linear-gradient(135deg,#0A5546,#19A591);border-radius:3px;opacity:.25;transition:opacity .3s}
.puzzle i.in{opacity:1}
.puzzle .words{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:10px;place-content:center}
.puzzle.fichas .words{grid-template-columns:1fr;gap:6px}
.puzzle .words span{background:var(--paper);color:var(--night);font-family:var(--f-display);font-weight:600;font-size:12.5px;line-height:1.15;text-align:center;padding:5px 4px;border-radius:7px;opacity:0;transform:scale(.9);transition:all .35s}
.puzzle.solved .words span{opacity:1;transform:none}
.score3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.score3 div{background:rgba(255,255,255,.05);border-radius:12px;padding:10px 4px;font-size:12px;color:var(--muted)}
.score3 b{display:block;font-family:var(--f-display);font-size:24px;color:#EAF7F1;font-variant-numeric:tabular-nums}
.verdict{text-align:center;padding:8px 0}
.verdict img{width:132px;height:132px;object-fit:contain;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.verdict .tot{font-family:var(--f-display);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}

.wagon::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(1,51,43,.15) 0%,rgba(1,51,43,.35) 45%,var(--night) 100%)}
.wagon .wtag{position:absolute;z-index:1;top:14px;left:16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;padding:4px 10px;border-radius:99px;background:rgba(1,31,26,.7);color:var(--brand);border:1px solid rgba(5,221,77,.4)}
.pv{width:190px;margin:10px auto 8px;aspect-ratio:264/280}
.pv img{width:100%;height:100%;display:block}
.mini{border:1px solid var(--line);background:transparent;color:var(--mint);border-radius:99px;padding:4px 12px;font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.tab{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#CFE6DD;border-radius:99px;padding:6px 12px;font-size:13px}
.tab.on{background:var(--mint);color:var(--night);border-color:var(--mint);font-weight:600}
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.parts.wide{grid-template-columns:repeat(3,minmax(0,1fr))}
.part{min-width:0;border:2px solid transparent;background:#FFFFFF;border-radius:12px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1;color:var(--ink)}
.parts.wide .part{aspect-ratio:2/1}
.part img{width:100%;flex:1;min-height:0;object-fit:contain}
.part svg{width:100%;height:78%}
.part small{font-size:10px;overflow-wrap:anywhere;line-height:1.1;text-align:center}
.part.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(5,221,77,.3)}
.part .none{font-size:11px;color:#19A591}
.part .sw{width:60%;aspect-ratio:1;border-radius:50%;border:2px solid rgba(0,0,0,.15)}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.nm{border:1px solid var(--line);background:rgba(255,255,255,.04);color:#EAF7F1;border-radius:10px;padding:8px 4px;font-size:13px}
.nm.sel{background:var(--brand);color:var(--night);border-color:var(--brand);font-weight:600}
.nm.taken{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.sync{font-size:11px;color:var(--muted);font-family:var(--f-mono)}.sync.wait{color:var(--gold)}

.vpin{display:none}
.andgrid,.vgrid,.rgrid{display:flex;flex-direction:column;gap:14px}
@media (min-width:960px){
  .app{max-width:1200px}
  .scene.wide{height:340px}
  .scene.booth{height:360px}.scene.platform{height:380px}
  .pad{padding:0 32px}
  .narrow{max-width:760px;margin-left:auto;margin-right:auto;width:100%}
  .andgrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:20px;align-items:start}
  .bld{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
  .bl{position:sticky;top:70px}
  .bld .pv{width:230px;margin:6px 0}
  .parts{grid-template-columns:repeat(5,minmax(0,1fr))}
  .opts,.window .glass .opts{display:grid;grid-template-columns:1fr 1fr}
  .q{font-size:22px}
  .rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;overflow:visible;padding:8px 32px 18px}
  .carbtn{flex:none}
  .wagon{height:360px}
  .wagon .wtag{left:32px}
  .vgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start;margin-top:-140px!important}
  .vleft{position:sticky;top:70px;display:flex;flex-direction:column;gap:14px}
  .vleft .steps{grid-template-columns:1fr 1fr}
  .vpin{display:block;width:150px;height:150px;object-fit:contain;align-self:center;margin-top:8px}
  .rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .verdict img{width:150px;height:150px}
}
.namein{width:100%;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#EAF7F1;padding:12px 14px;font:inherit;font-size:17px}
.namein:focus{outline:3px solid var(--brand);outline-offset:1px}
.qcase{font-size:14px;line-height:1.45;margin:4px 0 8px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.06);color:#CFE6DD;border-left:3px solid var(--brand)}
.window .glass .qcase{background:#E7E7E7;color:#3B4A45;border-left-color:#0A9A3C}
.opt.pick{border-color:var(--mint);background:rgba(191,253,227,.14)}
.window .glass .opt.pick{background:#E2F3EC;border-color:#01332B}
.cd{display:flex;justify-content:space-between;align-items:center;background:rgba(5,221,77,.12);border:1px solid rgba(5,221,77,.45);border-radius:14px;padding:10px 14px}
.cd b{font-family:var(--f-mono);font-size:28px;color:var(--mint);font-variant-numeric:tabular-nums}
.cd.warn{background:rgba(242,193,78,.14);border-color:rgba(242,193,78,.6)}.cd.warn b{color:var(--gold)}
.spin{width:44px;height:44px;margin:6px auto 0;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.top .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:420px){.top .ttl{display:none}.top{justify-content:space-between}}
/* resultados */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:70px 1fr 54px;gap:8px;align-items:center;font-size:13px}
.bar .tr{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:7px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th,table.cmp td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.cmp td.c,table.cmp th.c{text-align:center;width:62px}
.yes{color:var(--brand);font-weight:600}.nop{color:var(--bad)}
.gchart{display:flex;flex-direction:column;gap:8px}
.gq{display:grid;grid-template-columns:112px 1fr;gap:8px;align-items:center;font-size:12px}
.gq .pair{display:flex;flex-direction:column;gap:3px}
.gq .pair i{display:block;height:8px;border-radius:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--muted)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function interiorSVG(n){
  // vagón en perspectiva: X lateral (-1 a 1), Y altura, Z profundidad
  const W=680,H=340,cx=340,hz=150,f=360,eye=0.78;
  const P=(x,y,z)=>[cx+f*x/z, hz+f*(eye-y)/z];
  const poly=(pts,fill,op)=>`<polygon points="${pts.map(p=>P(...p).map(v=>v.toFixed(1)).join(",")).join(" ")}" fill="${fill}"${op?` opacity="${op}"`:""}/>`;
  const Z0=1,Z1=8,CE=1.35;
  let g="";
  g+=poly([[-1,CE,Z0],[1,CE,Z0],[1,CE,Z1],[-1,CE,Z1]],"#E3EAE7");
  g+=poly([[-1,0,Z0],[1,0,Z0],[1,0,Z1],[-1,0,Z1]],"url(#fl)");
  for(let i=-5;i<=5;i++){const x=i/5;g+=`<line x1="${P(x,0,Z0)[0]}" y1="${P(x,0,Z0)[1]}" x2="${P(x,0,Z1)[0]}" y2="${P(x,0,Z1)[1]}" stroke="#01332B" stroke-width="1.5" opacity=".45"/>`}
  g+=poly([[-1,0,Z0],[-1,CE,Z0],[-1,CE,Z1],[-1,0,Z1]],"#C7D3CE");
  g+=poly([[1,0,Z0],[1,CE,Z0],[1,CE,Z1],[1,0,Z1]],"#C7D3CE");
  for(let z=1.3;z<7.6;z+=1.1){
    g+=poly([[-1,.62,z],[-1,1.08,z],[-1,1.08,z+.75],[-1,.62,z+.75]],"#9FE3C8",.75);
    g+=poly([[1,.62,z],[1,1.08,z],[1,1.08,z+.75],[1,.62,z+.75]],"#9FE3C8",.75);
    g+=poly([[-.22,CE,z+.2],[.22,CE,z+.2],[.22,CE,z+.55],[-.22,CE,z+.55]],"#BFFDE3",.95);
  }
  g+=poly([[-1,0,Z1],[1,0,Z1],[1,CE,Z1],[-1,CE,Z1]],"#01332B");
  g+=poly([[-.2,0,Z1],[.2,0,Z1],[.2,1.05,Z1],[-.2,1.05,Z1]],"#0A5546");
  g+=poly([[-.12,.6,Z1],[.12,.6,Z1],[.12,.92,Z1],[-.12,.92,Z1]],"#BFFDE3",.85);
  const [tx,ty]=P(0,1.2,Z1);g+=`<text x="${tx}" y="${ty}" text-anchor="middle" font-family="Solve Pro,monospace" font-weight="600" font-size="9" fill="#05DD4D">VAGÓN ${n}</text>`;
  // sillas de lejos a cerca
  const box=(x0,x1,y0,y1,z0,z1,side,c)=>{let s="";
    const ax=side>0?x0:x1;
    s+=poly([[ax,y0,z0],[ax,y1,z0],[ax,y1,z1],[ax,y0,z1]],c[2]);
    s+=poly([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],c[1]);
    s+=poly([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],c[0]);return s};
  const seat=["#0A7A4A","#16B566","#075A36"],back=["#0C8C53","#1BC774","#086039"],base=["#9AA8A3","#B9C5C0","#7E8C87"];

      let s="";

function quiz(container,list,idx,answers,onDone,paper){
  const it=list[idx];
  container.innerHTML=`<div class="qhead"><span class="kicker">Pregunta ${idx+1} de ${list.length} · ${it.t}</span><span class="note" style="${paper?"color:#19A591":""}">${fmt(PQ)} pts</span></div>

   ${it.c?`<p class="qcase">${it.c}</p>`:""}<p class="q">${it.q}</p>
   <div class="opts">${it.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${L[i]}</b><span>${o}</span></button>`).join("")}</div>
   <div class="feedback" aria-live="polite"></div>`;
  container.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,ok=i===it.a;answers[idx]=ok;
    container.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(!EVENTO&&+x.dataset.i===it.a)x.classList.add("ok")});
    const f=container.querySelector(".feedback");
    if(EVENTO){b.classList.add("pick");f.className="feedback";f.textContent="Respuesta registrada"}
    else{if(!ok)b.classList.add("no");f.className="feedback "+(ok?"ok":"no");f.textContent=ok?`Correcta · +${fmt(PQ)} puntos`:"Incorrecta · la respuesta correcta está en verde"}
    setTimeout(()=>{idx+1<list.length?quiz(container,list,idx+1,answers,onDone,paper):onDone()},EVENTO?600:1100);
  });
}

      <label for="ga" class="note">Respuesta del grupo: la escribe y la envía una sola persona del grupo</label>
      <textarea id="ga" placeholder="Escriban aquí la respuesta acordada"></textarea>
      ${EVENTO?`<button class="btn" id="gsend">Enviar respuesta del grupo</button><p class="note" id="gmsg" aria-live="polite" style="margin:0"></p>`:""}</div>
      ${EVENTO?`<button class="btn ghost" id="gnext">Continuar ${c.n===1?"a las fichas":"al rompecabezas"}</button>`:
      `<div class="facil"><div class="kicker">Simulación del facilitador Solventum · solo en el demo</div><div style="font-size:14px;margin-top:6px">En el evento esto lo hace el facilitador Solventum desde su panel. Respuestas válidas:</div>
        <ul>${c.gk.map(k=>`<li>${k}</li>`).join("")}</ul>
        <div class="two" style="margin-top:12px"><button class="btn okb" id="gy">Correcta · 4 pts</button><button class="btn nob" id="gn">Incorrecta · 0</button></div></div>`}`;
    if(EVENTO){
      poll(r=>{showCD(r,"grupal");if(r.respuesta&&!$("#ga").value&&document.activeElement!==$("#ga")){$("#ga").value=r.respuesta}
        if(r.respuesta)$("#gmsg").textContent="Respuesta del grupo enviada. El facilitador Solventum la está validando.";});
      $("#gsend").onclick=async()=>{const v=$("#ga").value.trim();if(!v){$("#gmsg").textContent="Escriban la respuesta antes de enviarla.";return}
        $("#gsend").disabled=true;try{await rpc("enviar_grupal",{p_id:S.pid,p_token:S.ptoken,p_vagon:c.n,p_texto:v});$("#gmsg").textContent="Respuesta del grupo enviada. El facilitador Solventum la está validando."}
        catch(e){queue("enviar_grupal",{p_id:S.pid,p_token:S.ptoken,p_vagon:c.n,p_texto:v});$("#gmsg").textContent="Sin conexión: se enviará al volver la señal."}$("#gsend").disabled=false};
      $("#gnext").onclick=()=>next(2);
    }else{$("#gy").onclick=()=>{T.grp=4;next(2)};$("#gn").onclick=()=>{T.grp=0;next(2)}}
  }

  if(S.step===2){
    const F=c.n===1;
    st.innerHTML=`${cdHTML()}<div class="card stack"><div class="qhead"><span class="kicker">${F?"Fichas de valoración sobre la mesa":"Rompecabezas en acrílico · 35 × 25 cm"}</span><span class="note">4 pts · máximo 3 min</span></div>
      <div class="puzzle${F?" fichas":""}" id="pz">${Array.from({length:20},()=>"<i></i>").join("")}<div class="words">${c.w.map(w=>`<span>${w}</span>`).join("")}</div></div>
      <p class="note" style="margin:0">${F?"Las fichas están en desorden sobre la mesa. Organícenlas bajo los 5 títulos según el caso de Luis Lorenzo y descarten las que no corresponden. El facilitador Solventum toma el tiempo: tienen hasta 3 minutos para ganar los 4 puntos.":"Armen el rompecabezas en la mesa. El facilitador Solventum toma el tiempo: tienen hasta 3 minutos para ganar los 4 puntos. Al terminar, lean en voz alta las 10 palabras clave."}</p></div>
      ${EVENTO?`<button class="btn ghost" id="pnext">Ver resultado del vagón</button>`:
      `<div class="facil"><div class="kicker">Simulación del facilitador Solventum · solo en el demo</div>
        <div class="timer" id="tm">3:00</div><div class="ring"><i id="rg" style="width:100%"></i></div>
        <button class="btn" id="start" style="margin-top:10px">Iniciar cronómetro</button>
        <div class="stack" style="margin-top:8px;gap:8px"><button class="btn okb" id="p3" disabled>Completo en 3 min o menos · 4</button><button class="btn nob" id="pn" disabled>No completó · 0</button></div></div>`}`;
    const pieces=[...st.querySelectorAll("#pz i")].sort(()=>Math.random()-.5);
    if(EVENTO){
      let k=0;poll(r=>{showCD(r,"rompecabezas");if(r.fase==="rompecabezas"&&r.restante!=null){const want=Math.round((180-r.restante)/180*pieces.length);while(k<Math.min(want,pieces.length))pieces[k++].classList.add("in")}
        if(r.rompecabezas!=null){pieces.forEach(x=>x.classList.add("in"));if(r.rompecabezas)$("#pz").classList.add("solved")}});
      $("#pnext").onclick=()=>next(3);
    }else{
      let left=180,k=0;
      $("#start").onclick=()=>{$("#start").disabled=true;["p3","pn"].forEach(id=>$("#"+id).disabled=false);
        timerId=setInterval(()=>{left--;$("#tm").textContent=left>0?mmss(left):"Tiempo";$("#rg").style.width=(Math.max(left,0)/180*100)+"%";
          $("#tm").className="timer"+(left<=0?" over":left<=60?" warn":"");if(k<pieces.length&&left%2===0)pieces[k++].classList.add("in");
          if(left<=0){clearInterval(timerId);timerId=null;$("#p3").disabled=true}},250)};
      const fin=(p,b)=>{stopTimers();T.puz=p;T.bono=b;if(p){pieces.forEach(x=>x.classList.add("in"));$("#pz").classList.add("solved")}setTimeout(()=>{finishCar(T);S.step=3;vagon()},p?1200:300)};
      $("#p3").onclick=()=>fin(4,false);$("#pn").onclick=()=>fin(0,false);
    }
  }

  if(S.step===3){
    const draw=r=>{st.innerHTML=`<div class="card verdict">${r.won?`<img src="${A["pin"+c.n]}" alt="Pin del vagón ${c.n}">`:""}
      <div class="tot">${fmt(r.total)}<span style="font-size:20px;color:var(--muted)"> / 12</span></div>
      <h2 style="font-size:20px;margin:6px 0">${r.won?"Insignia ganada":"Vagón en tránsito"}</h2>
      <p class="lead" style="margin:0 0 14px">${r.won?"El facilitador Solventum perfora tu tiquete y te entrega el pin.":(r.ind+r.grp+r.puz>=8?"Sumaste 8 o más, pero la pregunta individual es obligatoria para ganar el pin.":"Necesitas 8 de 12 y la pregunta individual correcta para ganar el pin.")}</p>
      <div class="score3"><div><b>${r.ind}</b>Individual</div><div><b>${r.grp}</b>Grupal</div><div><b>${r.puz}</b>${c.n===1?"Fichas":"Rompecabezas"}</div></div></div>
      <button class="btn" id="back">Volver al andén</button>`;$("#back").onclick=()=>go("mapa")};
    if(S.cars[c.n])draw(S.cars[c.n]);
    else if(ONLINE()){
      st.innerHTML=`<div class="card verdict"><div class="spin" aria-hidden="true"></div><h2 style="font-size:20px;margin:10px 0 6px">Esperando la validación del facilitador Solventum</h2>
        <p class="lead" style="margin:0">Tu resultado aparece aquí apenas el facilitador Solventum registre la respuesta grupal y ${c.n===1?"las fichas":"el rompecabezas"}.</p></div><button class="btn ghost" id="back">Volver al andén</button>`;
      $("#back").onclick=()=>go("mapa");
      poll(r=>{if(r.grupal!=null&&r.rompecabezas!=null){stopTimers();finishCar({ind:r.individual??T.ind??0,grp:r.grupal,puz:r.rompecabezas,bono:!!r.bono});draw(S.cars[c.n])}});
    }else{st.innerHTML=`<p class="lead">Este vagón no tiene resultado todavía.</p><button class="btn ghost" id="back">Volver al andén</button>`;$("#back").onclick=()=>go("mapa")}
  }
}
function finishCar(T){const c=S.cur;const base=(T.ind||0)+(T.grp||0)+(T.puz||0);const total=base;
  S.cars[c]={ind:T.ind||0,grp:T.grp||0,puz:T.puz||0,bono:!!T.bono,total,won:base>=8&&T.ind===4};delete S.prog[c];saveSes();chip()}
async function syncPending(){if(!ONLINE())return;for(const n of Object.keys(S.prog)){if(S.prog[n]<1)continue;try{const r=await rpc("estado_vagon",{p_id:S.pid,p_token:S.ptoken,p_vagon:+n});
  if(r.grupal!=null&&r.rompecabezas!=null){const keep=S.cur;S.cur=+n;finishCar({ind:r.individual??0,grp:r.grupal,puz:r.rompecabezas,bono:!!r.bono});S.cur=keep;if(S.scene==="mapa")mapa()}}catch(e){}}}

let order=[];
function salida(){
  stopTimers();
  if(S.qi===0&&!S.exitAns.length){order=[...TEST.keys()].sort(()=>Math.random()-.5)}
  const list=order.map(i=>TEST[i]);
  view.innerHTML=`${doorSVG(false)}<div class="pad stack narrow" style="margin-top:16px">
    <div><div class="kicker">Puerta de salida · prueba final</div><p class="lead" style="margin-top:4px">Las mismas ${TEST.length} preguntas de la taquilla, en otro orden. Responde para abrir la puerta.</p></div>
    <div class="card" id="qbox"></div></div>`;
  const ans=[];
  quiz($("#qbox"),list,0,ans,()=>{S.exitAns=[];order.forEach((ti,k)=>S.exitAns[ti]=ans[k]);S.exit=S.exitAns.filter(Boolean).length*PQ;savePrueba("salida",S.exitAns);saveSes();go("resultados")},false);
}

function resultados(){
  stopTimers();
  if(S.entry==null){S.entryAns=[true,false,true,false,false,true,false,true,false,false];S.entry=S.entryAns.filter(Boolean).length*PQ}
  const cars=Object.values(S.cars),base=cars.reduce((a,c)=>a+c.ind+c.grp+c.puz,0),won=cars.filter(c=>c.won).length;
  const total=S.entry+base+S.exit,delta=S.exit-S.entry;
  const pre=[48,36,31,29,40,44,38,52,35,46],post=[92,84,81,77,88,86,83,94,80,90];
  view.innerHTML=`${doorSVG(true)}<div class="pad rgrid" style="margin-top:16px"><div class="stack">
    <div class="card verdict" style="padding-top:6px">${won===6?`<img src="${A.logopin}" alt="Pin Let's Heal" style="width:200px;height:auto">`:""}
      <div class="kicker">${S.avatar} · resultado final</div><div class="tot">${fmt(total)}<span style="font-size:20px;color:var(--muted)"> / 100</span></div>
      <p class="lead" style="margin:0">${won} de 6 insignias · ${delta>=0?"+":""}${fmt(delta)} puntos entre la entrada y la salida</p></div>
    <div class="card stack"><h2 style="font-size:17px">Entrada y salida</h2>
      <div class="bars">
        <div class="bar"><span>Taquilla</span><div class="tr"><i style="width:${S.entry/PMAX*100}%;background:var(--muted)"></i></div><b>${fmt(S.entry)}/${fmt(PMAX)}</b></div>
        <div class="bar"><span>Salida</span><div class="tr"><i style="width:${S.exit/PMAX*100}%;background:var(--brand)"></i></div><b>${fmt(S.exit)}/${fmt(PMAX)}</b></div>
        <div class="bar"><span>Vagones</span><div class="tr"><i style="width:${base/72*100}%;background:var(--teal)"></i></div><b>${base}/72</b></div></div>
      <table class="cmp"><thead><tr><th>Pregunta</th><th class="c">Entrada</th><th class="c">Salida</th></tr></thead><tbody>
      ${TEST.map((t,i)=>`<tr><td>${t.t}</td><td class="c ${S.entryAns[i]?"yes":"nop"}">${S.entryAns[i]?"Acertó":"Falló"}</td><td class="c ${S.exitAns[i]?"yes":"nop"}">${S.exitAns[i]?"Acertó":"Falló"}</td></tr>`).join("")}
      </tbody></table></div>
    </div><div class="stack">${EVENTO?"":`<div class="card stack"><div class="qhead"><h2 style="font-size:17px">Los 47 asistentes</h2><span class="pill transit">Datos de ejemplo</span></div>
      <p class="note" style="margin:0">Porcentaje de aciertos por pregunta. En el evento esto se ve en el tablero de premiación.</p>
      <div class="legend"><span><i style="background:var(--muted)"></i>Entrada</span><span><i style="background:var(--brand)"></i>Salida</span></div>
      <div class="gchart">${TEST.map((t,i)=>`<div class="gq"><span class="note">${t.t}</span>
        <div class="pair"><i style="width:${pre[i]}%;background:var(--muted)"></i><i style="width:${post[i]}%;background:var(--brand)"></i></div></div>`).join("")}</div>
      <p class="note" style="margin:0">Promedio del grupo: ${Math.round(pre.reduce((a,b)=>a+b)/pre.length)} % en la entrada y ${Math.round(post.reduce((a,b)=>a+b)/post.length)} % en la salida.</p></div>`}
    ${ticketHTML()}
    <button class="btn ghost" id="again">Volver al andén</button></div></div>`;
  $("#again").onclick=()=>go("mapa");
}
if(EVENTO){$("#demobar").remove()}
if(S.pid&&S.scene==="anden"&&S.entry!=null)S.scene="mapa";
render();flush();syncBadge();syncPending();
</script>
</body>
</html>
